# SPDX-License-Identifier: MIT
# Continuous integration: runs exactly the same make targets as a developer.
#   host: unit tests (normal, sanitizers, Valgrind), coverage, simulation, daemon integration, lint.
#   qemu: builds the ARM64 image with Buildroot and runs every in-guest test in QEMU.
# Mutation testing is not run here (three extra full rebuilds); run "make mutation" locally.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libmodbus-dev valgrind \
            cppcheck shellcheck libmosquitto-dev mosquitto mosquitto-clients
      - name: make test-host
        run: make test-host
      - name: Upload host results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-host
          path: |
            results/host
            results/sil/sil_metrics.json
            results/logs

  qemu:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space (remove preinstalled toolchains we do not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git bison flex bc libncurses-dev libssl-dev \
            libelf-dev rsync cpio unzip wget file patch perl xz-utils bzip2 qemu-system-arm \
            cmake pkg-config ccache sparse
      - name: Cache Buildroot downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            .cache/br-dl
            .cache/ccache
            .cache/buildroot-*.tar.xz
          key: buildroot-${{ hashFiles('VERSIONS.md', 'br2-external/configs/hvac_qemu_aarch64_defconfig', 'br2-external/board/hvac-qemu/linux.fragment') }}
          restore-keys: buildroot-
      - name: make test-qemu
        run: make test-qemu
      - name: Upload all results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-qemu
          path: results
