# hvacd configuration (PROJECT_PLAN.md section 4.5). One "key = value" per line; # starts a comment.
# Every key is optional; the values below are the defaults.
cool_setpoint_mc = 26000      # cooling setpoint, millidegrees C (26.0 C)
heat_setpoint_mc = 20000      # heating setpoint (20.0 C)
deadband_mc = 1000            # half-width of the switching band (1.0 C)
min_off_s = 180               # compressor minimum off time, seconds
min_run_s = 120               # compressor minimum run time, seconds
fault_recover_count = 5       # good readings needed to leave FAULT
max_step_mc = 5000            # largest believable change between readings (5.0 C)
loop_period_ms = 1000         # control loop period
iio_base_dir = /sys/bus/iio/devices
iio_device_name = hvac_temp
modbus_port = 502
modbus_max_clients = 4
log_level = info
